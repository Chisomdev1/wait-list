<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1 class="regular-Cabinet">+200 Waiter's Already</h1>
    <div class="container">
      <h1 class="text regular-Cabinet">
        Get Smarter, Faster — Join the Free PDF Summarizer Waitlist
      </h1>
      <p class="descr regular">
        Summarize lengthy PDFs in seconds. Save time, stay focused, and boost
        productivity — all for free. Be the first to get early access!
      </p>

      <div class="containers">
        <div class="text-waitlist">
          <h2 class="regular-Cabinet waitlist">Join the Waitlist</h2>
          <p class="regular text-small">
            Join now for early notification upon launch
          </p>
        </div>
        <div class="input-btn-container">
          <input
            type="text"
            class="input regular-Cabinet"
            placeholder="Enter your email"
          />
          <button type="button" class="btn regular-Cabinet">
            Join Waitlist
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
